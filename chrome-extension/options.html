<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>J-GO Importer Settings</title>
    <style>
      body {
        margin: 0;
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        background: #fafafa;
        color: #171717;
      }

      main {
        max-width: 560px;
        margin: 40px auto;
        padding: 24px;
        background: #fff;
        border: 1px solid #e5e5e5;
        border-radius: 20px;
      }

      h1 {
        margin: 0 0 8px;
        font-size: 24px;
      }

      p {
        margin: 0 0 20px;
        color: #737373;
        line-height: 1.6;
      }

      label {
        display: block;
        font-size: 13px;
        font-weight: 700;
        margin-bottom: 8px;
      }

      input {
        width: 100%;
        box-sizing: border-box;
        border: 1px solid #d4d4d4;
        border-radius: 14px;
        padding: 12px 14px;
        font-size: 14px;
      }

      button {
        margin-top: 16px;
        border: none;
        border-radius: 14px;
        background: #171717;
        color: #fff;
        padding: 12px 16px;
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
      }

      #status {
        margin-top: 12px;
        font-size: 13px;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>J-GO Importer</h1>
      <p>設定 J-GO API 網址。Extension 會將 ZOZO 商品 POST 到 `/api/import-product`。</p>
      <label for="api-base-url">J-GO API Base URL</label>
      <input
        id="api-base-url"
        type="url"
        placeholder="http://localhost:3000"
      />
      <button id="save-button" type="button">儲存設定</button>
      <p id="status"></p>
    </main>
    <script type="module" src="dist/options.js"></script>
  </body>
</html>
